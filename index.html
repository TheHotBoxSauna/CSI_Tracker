<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hot Box Sauna — Issue Tracker</title>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#2b2320; --sub:#7a6f66; --line:#e8e0d6;
  --amber:#c9702a; --amber-d:#a85a1c; --open:#c9702a; --closed:#3f7a52;
  --danger:#b3452f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1c1815; --card:#26211d; --ink:#f1ebe4; --sub:#a89c8f; --line:#3a332c; }
}
:root[data-theme="dark"]{ --bg:#1c1815; --card:#26211d; --ink:#f1ebe4; --sub:#a89c8f; --line:#3a332c; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line);}
h1{font-size:19px;margin:0 0 12px;font-weight:700;letter-spacing:-.01em;}
h1 span{color:var(--amber);}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
input#search{flex:1;min-width:160px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:13px;cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--amber);border-color:var(--amber);color:#fff;}
.newbtn{background:var(--amber);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;}
main{padding:12px 16px 40px;max-width:760px;margin:0 auto;}
.count{color:var(--sub);font-size:13px;margin:8px 2px 10px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;}
.row1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
.cname{font-weight:700;font-size:15px;}
.cdate{color:var(--sub);font-size:12px;white-space:nowrap;}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--sub);border:1px solid var(--line);}
.desc{color:var(--sub);font-size:13px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.02em;}
.status.Open{background:rgba(201,112,42,.15);color:var(--open);}
.status.Closed{background:rgba(63,122,82,.15);color:var(--closed);}
.meta{display:flex;gap:10px;color:var(--sub);font-size:12px;margin-top:6px;}
.empty{text-align:center;color:var(--sub);padding:50px 20px;font-size:14px;}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20;}
.overlay.show{display:flex;}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));}
@media(min-width:700px){.overlay{align-items:center;}.sheet{border-radius:16px;max-height:88vh;}}
.sheet h2{margin:0 0 14px;font-size:17px;}
label{display:block;font-size:12px;color:var(--sub);font-weight:600;margin:12px 0 5px;}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;font-family:inherit;}
textarea{min-height:64px;resize:vertical;}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tagpicker{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px;}
.tagpick{padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:12px;cursor:pointer;color:var(--sub);background:var(--bg);}
.tagpick.on{background:var(--amber);border-color:var(--amber);color:#fff;}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:5px;}
.seg div{flex:1;text-align:center;padding:9px;font-size:13px;cursor:pointer;color:var(--sub);}
.seg div.on{background:var(--amber);color:#fff;}
.actions{display:flex;gap:10px;margin-top:20px;}
.btn{flex:1;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;}
.btn.save{background:var(--amber);color:#fff;}
.btn.cancel{background:var(--bg);color:var(--ink);border:1px solid var(--line);}
.btn.del{background:transparent;color:var(--danger);border:1px solid var(--danger);flex:0 0 auto;padding:12px 16px;}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <h1>🔥 Hot Box <span>Issue Tracker</span></h1>
  <div class="toolbar">
    <input id="search" type="text" placeholder="Search customer or order #…">
    <button class="newbtn" onclick="openForm()">+ New</button>
  </div>
  <div class="toolbar" style="margin-top:8px;">
    <div class="chip active" data-f="All" onclick="setFilter(this,'All')">All</div>
    <div class="chip" data-f="Open" onclick="setFilter(this,'Open')">Open</div>
    <div class="chip" data-f="Closed" onclick="setFilter(this,'Closed')">Closed</div>
  </div>
</header>
<main>
  <div class="count" id="count">Loading…</div>
  <div id="list"></div>
</main>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="formTitle">New Issue</h2>
    <label>Customer name</label>
    <input type="text" id="f_c" placeholder="Jane Doe">
    <div class="twocol">
      <div><label>Order #</label><input type="text" id="f_o" placeholder="10123"></div>
      <div><label>Date</label><input type="date" id="f_d"></div>
    </div>
    <label>Status</label>
    <div class="seg" id="f_status">
      <div data-v="Open" onclick="pickStatus(this)">Open</div>
      <div data-v="Closed" onclick="pickStatus(this)">Closed</div>
    </div>
    <label>Issue type(s)</label>
    <div class="tagpicker" id="f_tags"></div>
    <label>Description / further info</label>
    <textarea id="f_desc" placeholder="What happened…"></textarea>
    <label>Resolution / action taken</label>
    <textarea id="f_res" placeholder="What was done…"></textarea>
    <div class="twocol">
      <div><label>Replacement SO #</label><input type="text" id="f_so" placeholder="SO-1234"></div>
      <div><label>Tech appt. needed?</label>
        <div class="seg" id="f_tech">
          <div data-v="No" onclick="pickTech(this)">No</div>
          <div data-v="Yes" onclick="pickTech(this)">Yes</div>
        </div>
      </div>
    </div>
    <div class="twocol">
      <div><label>Claim</label><input type="text" id="f_claim" placeholder="N/A"></div>
      <div><label>Refunded amount</label><input type="text" id="f_refund" placeholder="$0"></div>
    </div>
    <label>Further notes</label>
    <textarea id="f_notes" placeholder="Anything else…"></textarea>
    <div class="actions">
      <button class="btn del" id="delBtn" style="display:none" onclick="delIssue()">Delete</button>
      <button class="btn cancel" onclick="closeForm()">Cancel</button>
      <button class="btn save" onclick="saveIssue()">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const ISSUE_TYPES = ["Damaged Panel","Damaged Trim","Excessive Squeaking","Getting to Temp","Heater Assembly","Lamp Holder/Socket","Replacement Accessory","Alignment of Panels","Other"];
let db=null, col=null, issues=[], filter="All", editingId=null, pickedTags=new Set();

document.getElementById('f_tags').innerHTML = ISSUE_TYPES.map(t=>`<div class="tagpick" data-t="${t}" onclick="toggleTag(this)">${t}</div>`).join('');

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

const SEED = [

["Closed","Thomas Carman","10290","2026-01-09","Getting to Temp","Temp not getting above 150","Checked alignment and heat troubleshooting, ended up sending him extra silicon to lock in heat in multiple areas, hasn't reached out again w more issues","","No","",""],

["Closed","Matthew Gough","10417","2026-04-06","Damaged Trim","Damaged Mantra trim","Replacement trim sent","","No","",""],
["Open","Adam Augenstein","10392","2026-04-08","Getting to Temp,Damaged Trim","Sauna not getting to temp - reaching 180 minimum within 3 hours. No top silicon gasket on trim both sides + lots of small cosmetic damages (chips and 1 nail sticking out)","Replacement armrest trim with silicon gasket installed - issue not fixed. Electrical issue on his end, wants us to help cover costs - $600 reimbursement for sauna cover and inconvenience","","No","",""],

["Closed","Chris Nowling","HOT00173","2026-04-20","Other","V5 T-track splintered and cracked when trying to open lid and get out","Wood hardener sent - needs to clean up and sand track and apply many coats of hardener to fix door gliding issue","","No","",""],

["Closed","Ted Holman (Grant Eve)","10523","2026-04-26","Heater Assembly","Electrical issue internal to heater - hired own electrician","Pinched neutral wire grounding out. Paid $270 bill for him","","No","","$270"],
["Open","Trey Holtz","10886","2026-05-01","Heater Assembly","Electrical issue with stand alone heater","Brady requests to ship his heater to Brady for repair","","No","",""],
["Closed","Nick Grimaldi","10568","2026-05-06","Damaged Panel","Damaged panel from shipping","Replacement roof panel and replacement bulb (1 bad bulb)","","No","",""],
["Open","Jon Pohl","10557","2026-05-09","Damaged Panel","Damaged/bent floor panel","Replacement floor panel","","No","",""],
["Open","Matthew Rothgangel","Rogue - #537774","2026-05-14","Damaged Trim,Damaged Panel,Other","Very dinged up and sloppy cosmetics","Replacement sauna","","No","",""],
["Open","Dan Caine","10979","2026-05-16","Other","Damaged/bent rails, likely from shipping","Full standard track pack replacement and repairman","","No","",""]
];

async function init(){
  try{
    db = await claude.use("db");
  }catch(e){ db=null; }
  if(!db){ toast("Storage unavailable — showing demo only"); }
  else{
    col = db.collection("issues");
  }
  await loadOrSeed();
}

async function loadOrSeed(){
  if(!col){ render(); return; }
  const snap = await col.get();
  if(snap.docs.length===0){
    for(const row of SEED){
      await col.add(rowToObj(row));
    }
    const snap2 = await col.get();
    issues = snap2.docs.map(d=>({id:d.id,...d.data()}));
  }else{
    issues = snap.docs.map(d=>({id:d.id,...d.data()}));
  }
  col.onSnapshot(s=>{ issues = s.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{});
  render();
}

function rowToObj(r){
  return {c:r[0]==="" ? "Open":r[0], name:r[1], order:r[2], date:r[3], tags:r[4]?r[4].split(","):[], desc:r[5], res:r[6], so:r[7], tech:r[8]||"No", techAppt:"", claim:"", refund:r[10]||"", notes:""};
}

function setFilter(el,f){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');filter=f;render();}
document.getElementById('search').addEventListener('input', render);

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let list = issues.filter(i=>{
    if(filter!=="All" && (i.c||"Open")!==filter) return false;
    if(q){
      const hay = ((i.name||"")+" "+(i.order||"")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  list.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  document.getElementById('count').textContent = list.length + " issue" + (list.length===1?"":"s");
  const el = document.getElementById('list');
  if(list.length===0){ el.innerHTML = '<div class="empty">No matching issues.</div>'; return; }
  el.innerHTML = list.map(i=>`
    <div class="card" onclick="openForm('${i.id}')">
      <div class="row1">
        <div class="cname">${esc(i.name||"—")}</div>
        <div class="cdate">${fmtDate(i.date)}</div>
      </div>
      <div class="meta">
        <span class="status ${i.c==='Closed'?'Closed':'Open'}">${i.c==='Closed'?'Closed':'Open'}</span>
        ${i.order?`<span>#${esc(i.order)}</span>`:''}
        ${i.tech==='Yes'?'<span>🔧 Tech needed</span>':''}
      </div>
      ${(i.tags&&i.tags.length)?`<div class="tags">${i.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
      <div class="desc">${esc(i.desc||"")}</div>
    </div>`).join('');
}

function esc(s){return (s+"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function fmtDate(d){ if(!d) return ""; const parts=d.split("-"); if(parts.length!==3) return d; return `${parts[1]}/${parts[2]}/${parts[0].slice(2)}`; }

function toggleTag(el){ const t=el.dataset.t; if(pickedTags.has(t)){pickedTags.delete(t);el.classList.remove('on');} else {pickedTags.add(t);el.classList.add('on');} }
function pickStatus(el){ document.querySelectorAll('#f_status div').forEach(d=>d.classList.remove('on')); el.classList.add('on'); }
function pickTech(el){ document.querySelectorAll('#f_tech div').forEach(d=>d.classList.remove('on')); el.classList.add('on'); }

function openForm(id){
  editingId = id||null;
  document.querySelectorAll('.tagpick').forEach(t=>t.classList.remove('on')); pickedTags=new Set();
  document.querySelectorAll('#f_status div, #f_tech div').forEach(d=>d.classList.remove('on'));
  if(id){
    const i = issues.find(x=>x.id===id);
    document.getElementById('formTitle').textContent = "Edit Issue";
    document.getElementById('f_c').value = i.name||"";
    document.getElementById('f_o').value = i.order||"";
    document.getElementById('f_d').value = i.date||"";
    document.getElementById('f_desc').value = i.desc||"";
    document.getElementById('f_res').value = i.res||"";
    document.getElementById('f_so').value = i.so||"";
    document.getElementById('f_claim').value = i.claim||"";
    document.getElementById('f_refund').value = i.refund||"";
    document.getElementById('f_notes').value = i.notes||"";
    (i.tags||[]).forEach(t=>{pickedTags.add(t); const el=document.querySelector(`.tagpick[data-t="${t}"]`); if(el) el.classList.add('on');});
    document.querySelector(`#f_status div[data-v="${i.c==='Closed'?'Closed':'Open'}"]`).classList.add('on');
    document.querySelector(`#f_tech div[data-v="${i.tech==='Yes'?'Yes':'No'}"]`).classList.add('on');
    document.getElementById('delBtn').style.display='block';
  }else{
    document.getElementById('formTitle').textContent = "New Issue";
    ['f_c','f_o','f_d','f_desc','f_res','f_so','f_claim','f_refund','f_notes'].forEach(id=>document.getElementById(id).value="");
    document.querySelector('#f_status div[data-v="Open"]').classList.add('on');
    document.querySelector('#f_tech div[data-v="No"]').classList.add('on');
    document.getElementById('delBtn').style.display='none';
  }
  document.getElementById('overlay').classList.add('show');
}
function closeForm(){ document.getElementById('overlay').classList.remove('show'); }

async function saveIssue(){
  const name = document.getElementById('f_c').value.trim();
  if(!name){ toast("Customer name required"); return; }
  const obj = {
    name, order:document.getElementById('f_o').value.trim(), date:document.getElementById('f_d').value,
    c: document.querySelector('#f_status div.on')?.dataset.v || "Open",
    tags:[...pickedTags],
    desc:document.getElementById('f_desc').value.trim(),
    res:document.getElementById('f_res').value.trim(),
    so:document.getElementById('f_so').value.trim(),
    tech: document.querySelector('#f_tech div.on')?.dataset.v || "No",
    claim:document.getElementById('f_claim').value.trim(),
    refund:document.getElementById('f_refund').value.trim(),
    notes:document.getElementById('f_notes').value.trim()
  };
  if(!col){ toast("Storage unavailable"); return; }
  if(editingId){ await col.doc(editingId).update(obj); toast("Saved"); }
  else{ await col.add(obj); toast("Added"); }
  closeForm();
}
async function delIssue(){
  if(!editingId || !col) return;
  if(!confirm("Delete this issue?")) return;
  await col.doc(editingId).delete();
  toast("Deleted");
  closeForm();
}

init();
</script>
</body>
</html>
